services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-votohub}
      POSTGRES_USER: ${DB_USERNAME:-votohub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-votohub123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-votohub} -d ${DB_DATABASE:-votohub}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - votohub

  api:
    build:
      context: ./VotoHub
    restart: unless-stopped
    env_file:
      - ./VotoHub/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    networks:
      - votohub

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - votohub

volumes:
  postgres_data:

networks:
  votohub:
